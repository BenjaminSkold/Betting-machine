name: Rank wallets

on:
  schedule:
    - cron: "0 4 * * *" # daily, off-peak — per PROJECT.md, "daily is fine" for Tier 2
  workflow_dispatch: {}

jobs:
  rank-wallets:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pipeline/package-lock.json

      - run: npm ci

      - run: node src/rankWallets.js
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
