name: Backfill historical matches

on:
  # Deliberately infrequent -- see PROJECT.md's "Batching writes and pacing
  # the backfill." backfill.js processes one bounded batch (default 15
  # matches) per invocation and exits; running every 3 hours spreads the
  # full ~892-match historical backfill over roughly a week instead of one
  # burst against freshly-created Turso/R2 accounts.
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch: {}

jobs:
  backfill:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pipeline/package-lock.json

      - run: npm ci

      - run: node src/backfill.js
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
