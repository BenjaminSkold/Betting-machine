name: Collect Polymarket data

on:
  schedule:
    - cron: "*/5 * * * *" # GitHub Actions' real floor; collect.js loops internally to hit the adaptive schedule's tighter tiers within this gap
  workflow_dispatch: {}

# collect.js's inner loop runs for most of the 5-minute gap between ticks
# (see RUN_BUDGET_MS) -- this stops a slow run from overlapping the next
# scheduled tick and racing it on the same Turso/R2 writes.
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pipeline/package-lock.json

      - run: npm ci

      - run: npm test

      - run: node src/collect.js
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

      # Scoring and paper-bet placement/settlement depend on collect.js's
      # freshly-written snapshots and match results, so they run right
      # after it in the same job rather than on their own schedule.
      # if: always() so a collect.js failure (self-heals next cycle anyway)
      # doesn't also skip scoring/paper-betting for every match that DID
      # already have fresh data from an earlier successful run — the job
      # still reports overall failure if collect.js failed.
      - run: node src/scoreMatches.js
        if: always()
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

      - run: node src/paperBets.js
        if: always()
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
